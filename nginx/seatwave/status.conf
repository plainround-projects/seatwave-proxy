# The proxy's own counters (active, accepted and handled client connections, requests), for the
# lab network and this machine only. Published on 20920.
server {
    listen 8090;
    server_name localhost;
    access_log off;
    location = /nginx-status {
        stub_status;
        allow 10.209.9.0/24;
        allow 127.0.0.1;
        deny all;
    }
}
